[package]
name = "tuxtape-server"
edition = "2024"
description = "The central server for a complete TuxTape environment."

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
sqlx = { version = "0.8", features = [ "runtime-tokio", "postgres", "derive", "macros", "migrate" ] }
tokio = { version = "1.44", features = ["full"] }
color-eyre = "0.6"
tonic = {version = "0.12", features = ["tls", "gzip"] }
tonic-reflection = "0.12"
tonic-health = "0.12"
prost = "0.13"
proto = { path = "../lib/proto" }
thiserror = "2.0"

[[bin]]
name = "tuxtape-server"
path = "src/main.rs"

[lib]
name = "tuxtape_database_bridge"
path = "src/tuxtape_database_bridge/lib.rs"
