[package]
name = "tuxtape-server"
version = "0.1.0"
edition = "2024"
description = "The central server for a complete TuxTape environment."

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
diesel = { version = "2.2", features= ["postgres", "sqlite", "returning_clauses_for_sqlite_3_35" ]}
diesel_migrations = "2.2"
tokio = { version = "1.44", features = ["full"] }
color-eyre = "0.6"
libsqlite3-sys = { version = "0.29", features = ["bundled"] }
diesel-attributes = { path = "diesel-attributes" }
tonic = {version = "0.12", features = ["tls", "gzip"] }
tonic-reflection = "0.12"
tonic-health = "0.12"
prost = "0.13"
proto = { path = "../lib/proto" }

[[bin]]
name = "tuxtape-server"
path = "src/main.rs"
